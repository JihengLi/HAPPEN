[run]
out = ""
stages = ["exact", "near"]
profile_runtime = true

[exact]
root = ""
candidates_csv = ""
valid_csv = ""
modality = "T1w"
thread_workers = 64
process_workers = 32

[near]
preprocess_workers = 32
batch_size = 32
device = "auto"
use_amp = true
overwrite_embeddings = false
fail_fast = false

topk = 500
retrieval_batch_size = 2048
use_ivf = true
nlist = 4096
nprobe = 64
train_size = 200000
seed = 0
overwrite_retrieval = false
min_similarity = 0.92

review_mode = "lazy"   # off | lazy | precompute
review_workers = 32
overwrite_review_assets = false
max_scan_candidates_per_query = 100